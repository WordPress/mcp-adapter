name: PR Preview - Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build:
    name: Build plugin zip for Playground preview
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@43fc435558bc6cee69f5b214d6b8ca4f9f80c31d # v3
    permissions:
      contents: read
    with:
      # The `mcp-adapter` name is referenced by the publish workflow's
      # blueprint via the {{ARTIFACT_URL:mcp-adapter}} placeholder.
      artifacts: mcp-adapter=mcp-adapter.zip
      php-version: '8.5'
      node-version: '22'
      build-command: |
        composer install --no-dev --prefer-dist --no-interaction --no-progress
        npm ci
        npm run plugin-zip
