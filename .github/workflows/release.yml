name: Upload Package on Release

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

on:
  release:
    types: [published]

jobs:
  tag:
    name: Upload New Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Required to clone the repo and to upload the release asset.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # The Jetpack Autoloader adds autoload-dev paths to its manifest even
      # with --no-dev, and ignores exclude-from-classmap since 5.0.23. The
      # ZIP omits tests/, so any test class left in the manifest is a fatal
      # require on lookup (#283). Removing tests/ leaves nothing to map.
      - name: Remove test sources from the release build
        run: rm -rf tests

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: '--no-dev'
        env:
          # Give the Jetpack Autoloader the real plugin version for its class
          # manifest, so "newest copy wins" works when another plugin (e.g.
          # WooCommerce) bundles an older copy of the WP\MCP\ classes. Without
          # this, Composer guesses a dev-* version from the git ref.
          COMPOSER_ROOT_VERSION: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm ci
        env:
          CI: true

      - name: Create Artifact
        run: |
          npm run plugin-zip

      - name: Extract plugin ZIP for verification and deployment
        run: unzip -o mcp-adapter.zip -d build

      - name: Verify autoloader manifests against the ZIP
        run: php bin/verify-release-manifests.php build/mcp-adapter

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-adapter
          path: mcp-adapter.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: mcp-adapter.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check WordPress.org deployment version
        id: wordpress_org
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          php -r '
            $version = preg_replace( "/^v/", "", getenv( "RELEASE_TAG" ) );
            $deploy = preg_match( "/^[0-9]+\.[0-9]+\.[0-9]+$/D", $version ) && version_compare( $version, "0.7.0", ">=" );
            echo "deploy=" . ( $deploy ? "true" : "false" ) . PHP_EOL;
          ' >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org
        if: ${{ !github.event.release.prerelease && steps.wordpress_org.outputs.deploy == 'true' }}
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          BUILD_DIR: build/mcp-adapter
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
